version: '3.8'

services:
  backend:
    build:
      context: ./tienda-backend
      dockerfile: Dockerfile
    container_name: tcg-backend
    ports:
      - "3001:3001"
    env_file:
      - ./tienda-backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./tienda-front
      dockerfile: Dockerfile
    container_name: tcg-frontend
    ports:
      - "3000:3000"
    environment:
      # Modifica este enlace si subes tu contenedor backend a otro lado
      - NEXT_PUBLIC_API_URL=http://localhost:3001 
    depends_on:
      - backend
    restart: unless-stopped
